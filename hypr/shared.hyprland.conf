# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hyprland.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

# Dark theme
exec = gsettings set org.gnome.desktop.interface gtk-theme "Dracula"   # for GTK3 apps
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps
env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,1.2

# unscale XWayland
xwayland {
  force_zero_scaling = true
}

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = waybar & awww-daemon & swaync & hypridle & mwww-unfocus & mwww-daemon

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10, 5, 5, 5

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgb(4e4e4e)
    col.inactive_border = rgba(595959aa)

    # Set to true to enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = scrolling
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 8
        passes = 2

        vibrancy = 0.1696

        ignore_opacity = true
	new_optimizations = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    bezier = overshoot, 0.05, 0.9, 0.1, 1.1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, overshoot, slide
    animation = windowsOut, 1, 10.0, easeOutQuint, slide
    animation = windowsMove, 1, 2.25, easeOutQuint
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 6, easeOutQuint, slidevert
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


###############
### LAYOUTS ###
###############

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

scrolling {
    column_width = 0.9
    explicit_column_widths = 0.9
    fullscreen_on_one_column = true
    focus_fit_method = 1
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,ua,ru
    kb_variant =
    kb_model =
    kb_options = grp:alt_space_toggle 
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
	scroll_factor = 0.6
    }
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, return, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, F, fullscreen

# Screenshots
bind = , PRINT, exec, hyprshot -m window
bind = shift, PRINT, exec, hyprshot -m region

# Hyprpicker (color picker)
bind = $SUPER_SHIFT, P, exec, hyprpicker --autocopy --quiet --no-fancy --lowercase-hex

# Hyprlock
# Additionally, switches the keyboard layout to US (current - main keyboard, 0 - index of US keyboard layout)
bind = $SUPER_SHIFT, l, exec, hyprctl switchxkblayout current 0 && hyprlock

# Brigntness
bind = $mainMod, F5, exec, decrease-brightness
bind = $mainMod, F6, exec, increase-brightness

# awww (wallpapers)
bind = $mainMod, W, exec, topbarm hide-if-empty & set-theme $(theme-picker) && topbarm reload-and-show

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move active column to a workspace
# TODO
bind = $mainMod SHIFT CTRL, 1, layoutmsg, movetoworkspace, 1
bind = $mainMod SHIFT CTRL, 2, layoutmsg, movetoworkspace, 2
bind = $mainMod SHIFT CTRL, 3, layoutmsg, movetoworkspace, 3
bind = $mainMod SHIFT CTRL, 4, layoutmsg, movetocolworkspace 4
bind = $mainMod SHIFT CTRL, 5, layoutmsg, movetoworkspace, 5
bind = $mainMod SHIFT CTRL, 6, layoutmsg, movetoworkspace, 6
bind = $mainMod SHIFT CTRL, 7, layoutmsg, movetoworkspace, 7
bind = $mainMod SHIFT CTRL, 8, layoutmsg, movetoworkspace, 8
bind = $mainMod SHIFT CTRL, 9, layoutmsg, movetoworkspace, 9
bind = $mainMod SHIFT CTRL, 0, layoutmsg, movetoworkspace, 10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Move windows between columns (supports promotion to a new column)
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Swap columns
bind = $mainMod SHIFT CTRL, left, layoutmsg, swapcol l
bind = $mainMod SHIFT CTRL, right, layoutmsg, swapcol r

# Resize windows
# The resize is configured for up and down only because the left/right resize is handled with colresize
binde = $mainMod SHIFT ALT, up, resizeactive, 0 -10
binde = $mainMod SHIFT ALT, down, resizeactive, 0 10

# Resize columns
bind = SUPER SHIFT ALT, right, layoutmsg, colresize +0.05
bind = SUPER SHIFT ALT, left, layoutmsg, colresize -0.05
# cycles through explicit_column_widths, but since the only width configured is 0.9, will simply always resize the current column to 0.9
bind = SUPER SHIFT ALT, page_down, layoutmsg, colresize +conf

# Fit focused column to end
bind = SUPER SHIFT ALT, page_up, layoutmsg, fit tobeg

# Laptop multimedia keys for volume and LCD brightness
# bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
# bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioRaiseVolume, exec, increase-volume
bindel = ,XF86AudioLowerVolume, exec, decrease-volume
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus 1,match:class ^$,match:title ^$,match:xwayland 1,match:float 1,match:fullscreen 0,match:pin 0

windowrule {
    name = window-rules-for-mwww-daemon
    match:title = mwww-daemon

    no_blur = 1
    border_size = 0
    no_dim = 1
    no_shadow = 1
    float = 1
    pin = 1
    no_initial_focus = 1
}

windowrule {
    name = window-rules-for-mwww-unfocus-window
    match:class = mwww-dummy-unfocus

    no_blur = 1
    border_size = 0
    no_dim = 1
    no_shadow = 1
    rounding = 0
    float = 1
    no_anim = 1
}

windowrule {
    name = window-rules-for-theme-picker
    match:title = theme-picker

    border_size = 0
    no_dim = 1
    no_shadow = 1
    rounding = 0
    float = 1
    move = 0 0
    animation = popup
}

windowrule {
    name = window-rules-for-linux-desktop-gremlin
    match:title = ilgwg_desktop_gremlins.py

    no_blur = 1
    no_shadow = 1
    border_size = 0
}

